<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amoeba Soup</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Amoeba Soup">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const TENSION       = 8;   // Catmull-Rom handle divisor; higher = tighter curves, suppresses self-intersections
const MARGIN        = 10;  // px — skeleton points are radially projected onto this inner boundary
const P             = 10;  // skeleton control points per amoeba
const ENDGAME_FLASH = 3;   // seconds of edge-flashing before ejection
const ENDGAME_EJECT = 3;   // seconds over which all captives are ejected one by one
const ENDGAME_DRIFT = 5;   // seconds of free drift before predation resumes

// Pure-theatre predation tuning (see theatrics() below)
const EAT_RATIO     = 0.6; // one amoeba only reacts to another this much smaller / larger than itself
const NOTICE        = 3.0; // x the predator's radius - the distance at which the pair notice each other
const LUNGE_SPEED   = 4.5; // x base speed for the dart
const STARTLE_SPEED = 3.0; // x base speed for the flee; enough to stay ahead of a big pursuer past 1 s
const REST          = 4;   // s an amoeba lies up after a meal or a fright (randomised +/-30%)
const ACCEL_REF     = 8;   // per s - speed-lag rate for a reference-sized amoeba; scaled by 1/area in update()

const params    = new URLSearchParams(location.search);
const INIT_N    = Math.max(1, Math.min(200, parseInt(params.get('n'), 10) || 30));
const SPEED_MUL = Math.max(0.1, Math.min(20, parseFloat(params.get('speed')) || 0.7));
const COVERAGE  = Math.max(0.01, Math.min(2, parseFloat(params.get('coverage')) || 0.3));
const PREDATION = params.get('predation') !== 'false';


let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Scale initial radii so the sum of individual amoeba areas equals COVERAGE × canvas area.
// This undercounts visual coverage at high density for two reasons: (1) overlapping amoebas
// share pixels, so a pixel covered twice counts twice in the area sum but once on screen;
// (2) large amoebas have their skeleton points clamped to the canvas boundary (see buildPoints),
// flattening their sides and reducing their rendered area below π·r².
const _avgSqCoeff = 0.04**2 + 0.04*0.16 + 0.16**2/3; // E[(0.04+0.16t)²], t~U[0,1]
const SIZE_SCALE  = Math.sqrt(COVERAGE * W * H / (INIT_N * Math.PI * Math.min(W,H)**2 * _avgSqCoeff));

// Mid-range radius, used as the reference mass for acceleration. Fixed at load
// like SIZE_SCALE, so a resize doesn't restate what every amoeba weighs.
const R_REF = Math.min(W, H) * SIZE_SCALE * 0.12;

function sineNoise(phases, t) {
  let v = 0;
  for (const [freq, amp, phase] of phases) {
    v += Math.sin(t * freq + phase) * amp;
  }
  return v;
}

function makePhases(n, targetAmp) {
  const raw = Array.from({ length: n }, () => ({
    freq:  0.3 + Math.random() * 1.4,
    amp:   0.4 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,
  }));
  const total = raw.reduce((s, p) => s + p.amp, 0);
  return raw.map(p => [p.freq, p.amp / total * targetAmp, p.phase]);
}

class Amoeba {
  constructor(sizeT = Math.random()) {
    const minDim = Math.min(W, H);
    this.baseR = minDim * SIZE_SCALE * (0.04 + sizeT * 0.16); // size range: 4%–20% of min dimension

    this.x = this.baseR + Math.random() * (W - 2 * this.baseR);
    this.y = this.baseR + Math.random() * (H - 2 * this.baseR);

    this._baseSpeed = Math.max(W, H) / (30 + Math.random() * 20) * SPEED_MUL; // crosses long dim in 30–50 s
    this.speed = this._baseSpeed;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;

    this.age = Math.random() * 200; // random offset so amoebas don't pulse in sync
    this.hue = Math.floor(Math.random() * 360);

    this.rPhases    = Array.from({ length: P }, () => makePhases(4, 0.55)); // 4 waves, ±55% radial swing
    this.aPhases    = Array.from({ length: P }, () => makePhases(2, 0.12)); // 2 waves, ±0.12 rad angular swing; small to prevent skeleton crossings
    this.turnPhases = makePhases(3, 0.45); // 3 waves driving heading rotation

    this._rest    = Math.random() * REST; // s until it may act again; staggered so nothing fires in unison
    this._hunting = false; // set by the first dart, cleared only by a meal
    this._windup = 0;  // s left crouching, after which the dart fires
    this._excite = 0;  // s of bright outline left; set by predation only, never by throws
    this._targetSpeed = this._baseSpeed; // speed chases this, at a rate set by mass

    this._initialBaseR = this.baseR;
    this.swallowedBy   = null;
    this._capturedDist = 0;
    this._growTarget   = this.baseR;

    // Pre-allocate _pts so buildPoints() mutates in-place each frame
    this._pts  = Array.from({ length: P }, () => [0, 0]);
    this._path = null;

    // Cache stroke string — hue never changes so no need to rebuild each frame
    this.strokeFree = `hsla(${this.hue}, 75%, 78%, 0.55)`;
  }

  update(dt) {
    // Sim-time step. Positions are left on real dt because velocity already
    // carries SPEED_MUL; everything else here is a rate or a clock, so it scales.
    const st = dt * globalSpeedMult;

    this.age += st;

    this.baseR += (this._growTarget - this.baseR) * Math.min(1, 5 * st); // ~0.2 s time constant

    this._rest   = Math.max(0, this._rest   - st);
    this._excite = Math.max(0, this._excite - st);

    if (this.swallowedBy) this._windup = 0; // cancel a pounce that got eaten mid-crouch

    if (this._windup > 0) {
      // Crouch, then dart along whatever heading the crouch left us on. A burst
      // with no anticipation just reads as drifting slightly faster; the
      // hesitation is what makes the eye catch it.
      this._windup -= st;
      if (this._windup <= 0) burst(this, Math.atan2(this.vy, this.vx), LUNGE_SPEED);
    } else {
      // A dart carries further than a throw or a startle, so it fades more slowly.
      const decay = this._hunting ? 0.9 : 1.5;
      this._targetSpeed += (this._baseSpeed - this._targetSpeed) * Math.min(1, decay * st);
    }

    // Speed lags its target with an acceleration inversely proportional to mass
    // (i.e. to area, r²), so a big amoeba has to heave itself into a lunge while a
    // small one simply snaps. A first-order lag preserves the integral, so every
    // amoeba still covers the same ground per dart — only the peak, and how long
    // it takes to arrive, differ: ~4.4x almost at once at r=25, ~2.9x after 0.6 s
    // at r=110. Since baseR grows with eating, gorging also makes you ponderous.
    const accel = ACCEL_REF * (R_REF / this.baseR) ** 2;
    this.speed += (this._targetSpeed - this.speed) * Math.min(1, accel * st);

    const heading = Math.atan2(this.vy, this.vx) + sineNoise(this.turnPhases, this.age * 0.22) * st;
    this.vx = Math.cos(heading) * this.speed;
    this.vy = Math.sin(heading) * this.speed;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    if (this.swallowedBy) {
      const sw = this.swallowedBy;
      this._capturedDist = Math.max(sw.baseR * 0.35, this._capturedDist - sw.baseR * 0.06 * st); // leash settles to 35% of captor radius
      const dx = this.x - sw.x, dy = this.y - sw.y;
      const dist = Math.hypot(dx, dy);
      if (dist > this._capturedDist && dist > 0) {
        this.x = sw.x + (dx / dist) * this._capturedDist;
        this.y = sw.y + (dy / dist) * this._capturedDist;
        const outward = this.vx * (dx / dist) + this.vy * (dy / dist);
        if (outward > 0) {
          this.vx -= outward * (dx / dist);
          this.vy -= outward * (dy / dist);
        }
      }
    } else {
      if (this !== dragTarget) {
        // Bounce threshold 0.3× lets the body visibly squish before reversing
        const r = this.baseR * 0.3;
        if (this.x < r         && this.vx < 0) {
            this.vx =  Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3;
        }
        if (this.x > W - r     && this.vx > 0) {
            this.vx = -Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3;
        }
        if (this.y < r         && this.vy < 0) {
            this.vy =  Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3;
        }
        if (this.y > H - r     && this.vy > 0) {
            this.vy = -Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3;
        }

        const spd = Math.hypot(this.vx, this.vy);
        if (spd > 0) { this.vx = (this.vx / spd) * this.speed; this.vy = (this.vy / spd) * this.speed; }

        this.x = Math.max(r, Math.min(W - r, this.x));
        this.y = Math.max(r, Math.min(H - r, this.y));
      }
    }
  }

  // Computes skeleton points and Path2D once per frame; _pts mutated in-place
  buildPoints(t) {
    const pts = this._pts;
    for (let i = 0; i < P; i++) {
      const angle = (i / P) * Math.PI * 2 + sineNoise(this.aPhases[i], t * 0.35); // 0.35: angular noise runs slower than radial
      const r     = this.baseR * (1 + sineNoise(this.rPhases[i], t * 0.55));      // 0.55: radial noise clock speed
      pts[i][0] = Math.max(MARGIN, Math.min(W - MARGIN, this.x + Math.cos(angle) * r));
      pts[i][1] = Math.max(MARGIN, Math.min(H - MARGIN, this.y + Math.sin(angle) * r));
    }

    const n = P;
    const path = new Path2D();
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i];
      const p2 = pts[(i + 1) % n],     p3 = pts[(i + 2) % n];
      if (i === 0) path.moveTo(p1[0], p1[1]);
      path.bezierCurveTo(
        p1[0] + (p2[0] - p0[0]) / TENSION, p1[1] + (p2[1] - p0[1]) / TENSION,
        p2[0] - (p3[0] - p1[0]) / TENSION, p2[1] - (p3[1] - p1[1]) / TENSION,
        p2[0], p2[1],
      );
    }
    path.closePath();
    this._path = path;
  }

  draw() {
    if (this.swallowedBy) {
      ctx.save();
      ctx.clip(this.swallowedBy._path);
      const capPulse = Math.sin(this.age * 1.6) * 0.06;
      const cg = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.baseR * 1.3);
      cg.addColorStop(0, `hsla(${this.hue}, 55%, 62%, ${(0.50 + capPulse).toFixed(3)})`);
      cg.addColorStop(1, `hsla(${this.hue}, 65%, 28%, 0.28)`);
      ctx.fillStyle = cg;
      ctx.fill(this._path);
      const showStroke = endgamePhase === 'eject' ||
        (endgamePhase === 'flash' && Math.sin(performance.now() / 1000 * Math.PI * 6 + this.hue) > 0);
      if (showStroke) {
        ctx.strokeStyle = this.strokeFree;
        ctx.lineWidth   = 2;
        ctx.stroke(this._path);
      }
      ctx.restore();
    } else {
      const freePulse = Math.sin(this.age * 1.6) * 0.06;
      const fg = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.baseR * 1.5);
      fg.addColorStop(0, `hsla(${this.hue}, 45%, 88%, ${(0.20 + freePulse).toFixed(3)})`);
      fg.addColorStop(1, `hsla(${this.hue}, 68%, 50%, 0.44)`);
      ctx.fillStyle   = fg;
      ctx.fill(this._path);
      // Mid-burst amoebas outline brighter - the visual "tell" for a lunge or startle.
      // Derived from speed alone, so a thrown amoeba flashes too.
      const excited   = this._excite > 0;
      ctx.strokeStyle = excited ? `hsla(${this.hue}, 95%, 90%, 0.95)` : this.strokeFree;
      ctx.lineWidth   = excited ? 3 : 2;
      ctx.stroke(this._path);
    }
  }
}

// Uses Path2D hit-testing to detect when a smaller amoeba is fully inside a larger one.
// Paths are pre-built once per frame so no redundant _buildPath calls here.
// Nesting is always flat: if the eating amoeba is itself captured, the prey (and any
// amoebas the prey was already holding) join the top-level captor directly.
function checkSwallowing() {
  for (const b of amoebas) {
    if (b.swallowedBy) continue;
    for (const a of amoebas) {
      if (a === b) continue;
      if (ctx.isPointInPath(a._path, b.x, b.y) &&
          b._pts.every(([px, py]) => ctx.isPointInPath(a._path, px, py))) {
        const captor = a.swallowedBy ?? a;
        // Reparent anything b was already holding directly to captor,
        // and credit each one's area to the captor so eject accounting stays balanced
        for (const inner of amoebas) {
          if (inner.swallowedBy === b) {
            inner.swallowedBy   = captor;
            inner._capturedDist = Math.hypot(inner.x - captor.x, inner.y - captor.y);
            captor._growTarget  = Math.sqrt(captor._growTarget ** 2 + inner._initialBaseR ** 2);
          }
        }
        b.swallowedBy    = captor;
        a._hunting = false;                              // fed at last, so it can lie up
        a._rest    = REST * (0.7 + Math.random() * 0.6);
        if (audio_started) play('bloop');
        b._capturedDist  = Math.hypot(b.x - captor.x, b.y - captor.y);
        b._growTarget    = b._initialBaseR;  // b shrinks back since its children left
        captor._growTarget = Math.sqrt(captor._growTarget ** 2 + b._initialBaseR ** 2);
        break;
      }
    }
  }
}

// ─── PURE-THEATRE PREDATION ───────────────────────────────────────────────────
// Nothing is ever steered toward or away from anything over time. There is no
// attraction or repulsion field, so no clustering or corner-pileup dynamics can
// emerge — the wandering motion is exactly what it was before. All that is added
// is two one-shot impulses, each behind a rest timer:
//
//   LUNGE   — a predator with prey in range turns to face it, crouches, then
//             springs. It stays on the hunt from then on, a dart a second, and
//             rests only once it has actually eaten.
//   STARTLE — prey bolts into open water, and keeps running for as long as the
//             threat is in range: the first reaction is a sharp reflex turn, and
//             after that it steers, rate-limited, toward whatever heading has the
//             most room ahead. That continuous steering is the one place anything
//             is repelled from anything, so the open-water test below is what
//             stands between a hunted amoeba and a corner.
//
// Both fade back to a normal drift through the speed decay in update(). Note that
// a hunt is open-ended: what keeps a dogged hunter from herding prey into a corner
// is the escape scan below, not any limit on how long it may keep trying.

// Distance from (x,y) to the canvas edge along heading h, so a startle never
// picks an escape route that runs straight into a wall.
function roomAhead(x, y, h) {
  const cx = Math.cos(h), cy = Math.sin(h);
  let t = Infinity;
  if (cx >  1e-6) t = Math.min(t, (W - x) / cx);
  if (cx < -1e-6) t = Math.min(t, -x / cx);
  if (cy >  1e-6) t = Math.min(t, (H - y) / cy);
  if (cy < -1e-6) t = Math.min(t, -y / cy);
  return t;
}

// Sets the *target* speed only — how fast the amoeba actually gets there is
// decided by its mass, in update().
function burst(a, heading, mult) {
  a._targetSpeed = a._baseSpeed * mult;
  a.vx = Math.cos(heading) * a.speed;
  a.vy = Math.sin(heading) * a.speed;
}

function theatrics(dt) {
  const st = dt * globalSpeedMult; // flee steering is a rate, so it slows with everything else
  for (const a of amoebas) {
    if (a.swallowedBy || a === dragTarget) continue;

    // Nearest thing that could eat me, and nearest thing I could eat. Both use
    // the predator's radius as the notice distance, so the two spot each other at
    // the same moment — the crouch is what hands the prey its head start.
    let threat = null, threatD = Infinity;
    let prey   = null, preyD   = Infinity;
    for (const b of amoebas) {
      if (b === a || b.swallowedBy) continue;
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      if (a.baseR < b.baseR * EAT_RATIO && d < b.baseR * NOTICE && d < threatD) { threat = b; threatD = d; }
      if (b.baseR < a.baseR * EAT_RATIO && d < a.baseR * NOTICE && d < preyD)   { prey   = b; preyD   = d; }
    }

    // Fleeing beats feeding.
    if (threat) {
      const away = Math.atan2(a.y - threat.y, a.x - threat.x);
      // Offsets are ordered centre-out and room is capped at six radii, so
      // straight-away wins whenever it is clear and a sideways break is taken only
      // when a wall is genuinely nearer that way. This is what stops a startled
      // amoeba from being flushed into a corner.
      let best = away, bestRoom = -1;
      for (const off of [0, 0.55, -0.55, 1.1, -1.1, 1.7, -1.7]) {
        const room = Math.min(roomAhead(a.x, a.y, away + off), a.baseR * 6);
        if (room > bestRoom + 1) { bestRoom = room; best = away + off; }
      }
      if (a._rest === 0) {
        // The reflex: snap round and go. _rest only gates this sharp turn, never
        // the running itself, so it re-triggers every 1.5 s while still hunted.
        burst(a, best + (Math.random() - 0.5) * 0.5, STARTLE_SPEED);
        a._rest = 1.5;
      } else {
        // Still fleeing: hold the pace and bend toward open water at up to
        // 3 rad/s, so the escape route keeps updating as the chase moves.
        const h = Math.atan2(a.vy, a.vx);
        const d = ((best - h + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
        burst(a, h + Math.max(-3 * st, Math.min(3 * st, d)), STARTLE_SPEED);
      }
      a._excite = 1.2;
      continue;
    }

    if (a._rest > 0) continue;

    if (prey) {
      const toPrey = Math.atan2(prey.y - a.y, prey.x - a.x);

      // Turn to face and drop into a crouch; update() springs along this heading
      // when the crouch ends. Follow-up darts crouch half as long — the opening
      // pounce is deliberate, the rest of the hunt is snapping.
      a.vx = Math.cos(toPrey) * a.speed;
      a.vy = Math.sin(toPrey) * a.speed;
      a._targetSpeed = a._baseSpeed * 0.3;
      a._windup = a._hunting ? 0.15 : 0.3;
      a._excite = a._windup + 1.4;
      // A hunter presses on, a dart a second, and only lies up once it has fed —
      // see checkSwallowing(), which is the sole thing that clears _hunting.
      a._hunting = true;
      a._rest    = 1;
    }
  }
}

// Stratified sampling: one random draw per evenly-spaced bucket guarantees full size range
const amoebas  = Array.from({ length: INIT_N }, (_, i) => new Amoeba((i + Math.random()) / INIT_N));
const sortBuf  = amoebas.map((a, i) => ({ a, i })); // pre-allocated; sorted in-place each frame

let endgamePhase    = 'idle'; // 'idle' | 'flash' | 'eject' | 'drift'
let endgameTimer    = 0;
let ejectTimer      = 0;      // counts up within eject phase; fires each captive at even intervals
let ejectContainer  = null;  // the single free amoeba at the start of eject phase
let ejectInterval   = 0;     // fixed interval between ejections (5 s / initial captive count)
let globalSpeedMult = SPEED_MUL;
let simTime         = 0;
let dragTarget      = null;
let dragMx = 0, dragMy = 0;
let dragOffsetX = 0, dragOffsetY = 0;
let dragHistory = [];

canvas.addEventListener('pointerdown', e => {
  const mx = e.clientX, my = e.clientY;
  let best = null;
  for (const a of amoebas) {
    if (a.swallowedBy) continue;
    if (ctx.isPointInPath(a._path, mx, my)) {
      if (!best || a.baseR < best.baseR) best = a;
    }
  }
  if (best) {
    dragTarget = best;
    dragMx = mx; dragMy = my;
    dragOffsetX = best.x - mx;
    dragOffsetY = best.y - my;
    dragHistory = [{ x: mx, y: my, t: performance.now() }];
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
  play('fumarole');
  audio_started = true;
  acquireWakeLock();
});

canvas.addEventListener('pointermove', e => {
  if (!dragTarget) return;
  dragMx = e.clientX;
  dragMy = e.clientY;
  dragHistory.push({ x: dragMx, y: dragMy, t: performance.now() });
  if (dragHistory.length > 15) dragHistory.shift();
});

canvas.addEventListener('pointerup', () => {
  if (!dragTarget) return;
  const now = performance.now();
  const recent = dragHistory.filter(h => now - h.t < 150);
  if (recent.length >= 2) {
    const first = recent[0], last = recent[recent.length - 1];
    const dx = last.x - first.x, dy = last.y - first.y;
    const d = Math.hypot(dx, dy);
    const throwDt = (last.t - first.t) / 1000;
    if (d > 2 && throwDt > 0) {
      const throwSpd = Math.min(d / throwDt, dragTarget._baseSpeed * 5);
      dragTarget.speed        = throwSpd; // a throw is external, so it lands instantly
      dragTarget._targetSpeed = throwSpd;
      dragTarget.vx = (dx / d) * throwSpd;
      dragTarget.vy = (dy / d) * throwSpd;
    }
  }
  dragTarget = null;
  dragHistory = [];
});

window.addEventListener('keydown', e => {
  let factor = 0;
  if (e.key === '+' || e.key === '=') factor = 1.25;
  else if (e.key === '-')             factor = 0.8;
  if (factor) {
    globalSpeedMult *= factor;
    for (const a of amoebas) { a._baseSpeed *= factor; a.speed *= factor; a._targetSpeed *= factor; }
  }
});

let lastTs = 0;
function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  simTime += dt * globalSpeedMult;

  ctx.clearRect(0, 0, W, H);

  if (dragTarget) { dragTarget.x = dragMx + dragOffsetX; dragTarget.y = dragMy + dragOffsetY; }
  for (const a of amoebas) a.buildPoints(simTime);

  if (PREDATION) {
    if (endgamePhase === 'idle') {
      const freeCount = amoebas.reduce((n, a) => n + (a.swallowedBy ? 0 : 1), 0);
      if (freeCount === 1 && amoebas.length > 1) { endgamePhase = 'flash'; endgameTimer = 0; }
      else { checkSwallowing(); theatrics(dt); }
    } else {
      endgameTimer += dt;
      if (endgamePhase === 'flash' && endgameTimer >= ENDGAME_FLASH) {
        endgamePhase = 'eject'; endgameTimer = 0; ejectTimer = 0;
        ejectContainer = amoebas.find(a => !a.swallowedBy);
        ejectInterval  = ENDGAME_EJECT / Math.max(1, amoebas.filter(a => a.swallowedBy === ejectContainer).length);
      } else if (endgamePhase === 'eject') {
        ejectTimer += dt;
        const container = ejectContainer;
        const captives  = amoebas.filter(a => a.swallowedBy === container);
        if (!container || captives.length === 0) {
          endgamePhase = 'drift'; endgameTimer = 0;
        } else {
          if (ejectTimer >= ejectInterval) {
            ejectTimer -= ejectInterval;
            const c = captives[Math.floor(Math.random() * captives.length)];
            // Direction: random but biased toward canvas centre so corner containers
            // don't fire captives straight into the wall
            const tcx = W / 2 - container.x, tcy = H / 2 - container.y;
            const tcLen = Math.hypot(tcx, tcy) || 1;
            const randAngle = Math.random() * Math.PI * 2;
            let dx = Math.cos(randAngle) + (tcx / tcLen) * 0.7; // 0.7: centre-bias strength (0 = pure random, 1 = always toward centre)
            let dy = Math.sin(randAngle) + (tcy / tcLen) * 0.7;
            const dLen = Math.hypot(dx, dy) || 1;
            dx /= dLen; dy /= dLen;
            const burst = container.baseR * 5; // ejection speed relative to container size
            c.swallowedBy = null;
            c.vx = dx * burst; c.vy = dy * burst; c.speed = burst;
            if (audio_started) {
              const now = performance.now();
              if (now - lastPopTime > 80) {
                lastPopTime = now;
                const p = document.getElementById('pop').cloneNode(true);
                p.volume = 1.0;
                p.play();
              }
            }
            container._growTarget = Math.sqrt(Math.max(0, container._growTarget ** 2 - c._initialBaseR ** 2));
          }
        }
      } else if (endgamePhase === 'drift' && endgameTimer >= ENDGAME_DRIFT) {
        endgamePhase = 'idle';
      }
    }
  }

  // Captured amoebas draw first (depth 1 before depth 0); stable index tiebreak prevents flicker
  sortBuf.sort((x, y) => (y.a.swallowedBy ? 1 : 0) - (x.a.swallowedBy ? 1 : 0) || x.i - y.i);

  for (const { a } of sortBuf) { a.update(dt); a.draw(); }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

// AUDIO
function play(id) {
    const audio = document.getElementById(id);
    if (audio.paused || audio.ended || audio.currentTime == 0) {
        audio.play();
    }
}

const sounds = [
    ["bloop", "bloop.wav", false, .4],
    ["brook", "brook.mp3", true, .2],
    ["pop", "pop.mp3", false, 1.],

    ["fumarole", "fumarole.mp3", true, .4]
];

for (const [name, file, loop, vol] of sounds) {
    const aud = new Audio(file);
    aud.id = name;
    aud.loop = loop;
    aud.volume = vol;
    document.body.appendChild(aud);
}

let audio_started = false;
let lastPopTime = 0;
document.addEventListener('visibilitychange', () => {
    if (!audio_started) return;
    const ambient = ['brook', 'fumarole'];
    if (document.hidden) {
        ambient.forEach(id => document.getElementById(id).pause());
    } else {
        ambient.forEach(id => document.getElementById(id).play());
    }
});
// END AUDIO

// WAKE LOCK
// Keeps the display awake while the page is visible, so the animation can be
// left running unattended. Requires a secure context (https); silently does
// nothing where unsupported or denied.
let wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    // Cleared by the browser whenever the page is hidden, so drop our handle
    // too and let visibilitychange below re-acquire it.
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch {
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) acquireWakeLock();
});

acquireWakeLock();
// END WAKE LOCK
